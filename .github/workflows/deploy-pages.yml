name: Deploy Research Report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "research-agent/docs/research/**"
      - "research-agent/publish_skills.py"
      - "research-agent/competitor_feed.py"
      - "research-agent/scripts/write_auth_config.py"
      - ".agents/skills/**"
      - "site-next/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish skills pack for GitHub Pages
        run: python3 research-agent/publish_skills.py

      - name: Write Google auth config
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: python3 research-agent/scripts/write_auth_config.py

      - name: Publish the preview site at /v2
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          src = Path("site-next")
          dst = Path("research-agent/docs/research/v2")
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(
              src,
              dst,
              ignore=shutil.ignore_patterns("_build.py", "__pycache__", "*.pyc", ".DS_Store"),
          )
          print(f"copied {src} -> {dst}")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: research-agent/docs/research

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
