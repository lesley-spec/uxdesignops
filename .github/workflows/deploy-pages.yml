name: Deploy Research Report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "research-agent/docs/research/**"
      - "research-agent/publish_skills.py"
      - "research-agent/competitor_feed.py"
      - "research-agent/scripts/write_auth_config.py"
      - ".agents/skills/**"
      - "site-next/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish skills pack for GitHub Pages
        run: python3 research-agent/publish_skills.py

      - name: Write Google auth config
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: python3 research-agent/scripts/write_auth_config.py

      - name: Stage the new site at / and the previous site at /v1
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          old = Path("research-agent/docs/research")
          new = Path("site-next")
          stage = Path("_site")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()
          junk = shutil.ignore_patterns("__pycache__", "*.pyc", ".DS_Store")
          # The previous site, unchanged, under /v1.
          shutil.copytree(old, stage / "v1", ignore=junk)
          # The new site at the root.
          shutil.copytree(
              new,
              stage,
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns("_build.py", "_partials", "README.md", "__pycache__", "*.pyc", ".DS_Store"),
          )
          # Installer files keep their existing URLs, because the install commands on the new site download them.
          for item in (old / "skills").iterdir():
              if item.name == "index.html":
                  continue
              target = stage / "skills" / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True, ignore=junk)
              else:
                  shutil.copy2(item, target)
          print(f"staged {stage}: new site at /, previous site at /v1/")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
